<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List Pro</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=KoHo:wght@300;400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <!-- HEADER -->
    <header>
      <h1>To-Do List</h1>
    </header>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="Adicionar uma tarefa..."/>
      <button id="addTaskBtn">Add + </button>
    </div>

    <ul id="taskList">

    </ul>
  </div>

  <!-- JS -->
  <script src="script.js"></script>

</body>
</html>
